# Checks that run before an exported model goes to the car.
# Override any value from the command line, e.g. parity.image_count=64.
# Every number below is a team-chosen default, not a competition rule.

parity:
  # Evenly spaced images from the sorted test split.
  image_count: 32
  # The confidence the car would use. Both models run slightly below it, so a
  # score that crosses the threshold is compared instead of counted as a miss.
  confidence: 0.25
  confidence_margin: 0.05
  nms_iou: 0.7
  max_det: 300
  # IoU needed to pair a checkpoint box with an exported-model box.
  match_iou: 0.5
  # Limits per numeric precision of the exported file.
  tolerances:
    fp32:
      max_box_deviation_px: 1.0
      max_confidence_difference: 0.01
      max_class_disagreement_rate: 0.0
      max_unmatched_rate: 0.01
    fp16:
      max_box_deviation_px: 2.0
      max_confidence_difference: 0.02
      max_class_disagreement_rate: 0.0
      max_unmatched_rate: 0.02
    int8:
      max_box_deviation_px: 12.0
      max_confidence_difference: 0.15
      max_class_disagreement_rate: 0.02
      max_unmatched_rate: 0.15

quantization:
  # Evenly spaced images from the sorted train split. Never val or test.
  calibration_images: 64
  int8:
    # The decode head mixes pixel boxes and 0-1 scores; quantizing it erases the scores.
    op_types: [Conv]
    per_channel: true
    calibrate_method: MinMax
  # Accuracy a quantized release may lose against the fp32 export, on the test split.
  limits:
    max_map50_95_drop: 0.02
    max_recall_drop: 0.02

gates:
  # Pass/fail limits for a release. Every limit here is team-chosen.
  # None of them is taken from the FSG rules. Tune them to your car.
  confidence: ${parity.confidence}
  nms_iou: ${parity.nms_iou}
  max_det: ${parity.max_det}
  match_iou: 0.5
  # Box height / image height. A stand-in for distance, not a measurement.
  size_bands:
    far: [0.0, 0.04]
    mid: [0.04, 0.12]
    near: [0.12, 1.0]
  # The pair whose swap sends the planner the wrong way.
  color_classes: [blue_cone, yellow_cone]
  # min_<metric> or max_<metric>. Metrics: recall, precision,
  # false_positives_per_image, color_confusion_rate, recall_<band>, precision_<band>.
  limits:
    min_recall: 0.7
    min_precision: 0.8
    min_recall_far: 0.4
    min_recall_mid: 0.8
    min_recall_near: 0.9
    max_color_confusion_rate: 0.02
    max_false_positives_per_image: 1.0

benchmark:
  # Real test images, one at a time, through the contract in core/deployment.py.
  image_count: 32
  warmup_runs: 10
  measured_runs: 200
